<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Marginway · 在语境中学习</title>
    <link rel="stylesheet" href="showcase.css" />
  </head>
  <body>
    <main class="mw-showcase">
      <header class="mw-showcase__intro">
        <div>
          <p class="mw-showcase__brand">Marginway · 语境</p>
          <h1>让学习，留在语境里。</h1>
        </div>
        <p class="mw-showcase__description">
          看视频、读双语字幕，随手留下想法。<br />从原文出发，让思考延续。
        </p>
      </header>
      <figure class="mw-showcase__figure">
        <a
          class="mw-showcase__image-link"
          href="../assets/product-youtube.png"
          target="_blank"
          rel="noopener"
          aria-label="在新标签页查看完整运行截图"
        >
          <img
            src="../assets/product-youtube.png"
            width="2494"
            height="1726"
            alt="Marginway 实际运行：视频下方显示当前句双语字幕，右侧字幕列表保留前后文，提供笔记和重播入口。"
          />
        </a>
        <figcaption>
          <span
            >双语字幕 · 语境笔记 ·
            原文回溯（含机器翻译，不代表原作者背书）</span
          >
          <a
            href="https://www.youtube.com/watch?v=jkrNMKz9pWU"
            target="_blank"
            rel="noopener noreferrer"
            >Jeremy Howard · CC BY ↗</a
          >
        </figcaption>
      </figure>
    </main>
  </body>
</html>
