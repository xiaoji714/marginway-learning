name: Browser acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install pinned Chrome for Testing and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk xvfb libasound2t64 libatk-bridge2.0-0 libgtk-3-0 libnss3
          curl --fail --location --output /tmp/chrome.zip https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.52/linux64/chrome-linux64.zip
          # Fingerprint of this fixed archive downloaded from the official Google URL.
          echo "e66f66d4802a46d4a022667e668aa950e277cadbfbed4b3777915b47413a0ef9  /tmp/chrome.zip" | sha256sum -c -
          unzip -q /tmp/chrome.zip -d .local
      - name: Browser flows with visual checkpoints
        env:
          MARGINWAY_CHROME: ${{ github.workspace }}/.local/chrome-linux64/chrome
        run: xvfb-run --auto-servernum pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            .local/browser-results
            .local/browser-report
            tests/browser/snapshots
