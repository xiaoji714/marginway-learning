name: Issue lifecycle
on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to reconcile from current state
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/governance.ts issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue }}
