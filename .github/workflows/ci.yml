name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
      - uses: actions/upload-artifact@v4
        with:
          name: marginway-learning-${{ matrix.os }}
          path: dist/*.zip*
  runtime:
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        node: [22.13.0, 24.0.0, 26.0.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Locate runtime under test
        id: runtime
        run: node -p '"path=" + process.execPath' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: marginway-learning-ubuntu-latest
          path: dist
      - run: pnpm run test:release
        env:
          MARGINWAY_RUNTIME_NODE: ${{ steps.runtime.outputs.path }}
  pr-gate:
    if: always()
    needs: [verify, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Require all platforms and runtime versions
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: test "$VERIFY_RESULT" = success && test "$RUNTIME_RESULT" = success
